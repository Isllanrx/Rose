version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot reads the trailing "# vX" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    # Wait before proposing a fresh release: compromised packages are usually
    # caught and yanked within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Pinned runtime and tooling dependencies. Each PR still goes through CI, the
  # PyInstaller build job and, for Pillow/PyInstaller, an in-game check (backlog #77).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["ruff", "mypy", "pip-audit", "zizmor", "actionlint-py"]
