name: Quality

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

jobs:
  quality:
    # Rose is Windows-only: several modules call ctypes.windll at import time.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (blocking rules from pyproject.toml)
        run: python -m ruff check .

      - name: Unit tests (includes the ADR-008 silent-except guard)
        run: python -m unittest discover -s test -t . -v

      - name: Quality ratchet (mypy and reported Ruff rules must not grow)
        run: python scripts/quality_gate.py
